services:
  accordance-web:
    build: .
    container_name: accordance-web
    ports:
      - "8000:8000"
    environment:
      ACCORDANCE_WEB_DATA_DIR: /data/web_clients
    volumes:
      - accordance_web_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  accordance_web_data:
