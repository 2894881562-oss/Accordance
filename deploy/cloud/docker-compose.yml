services:
  accordance-web:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ACCORDANCE_WEB_DATA_DIR: /data/web_clients
    volumes:
      - accordance_web_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      accordance-web:
        condition: service_healthy
    environment:
      ACCORDANCE_SITE_ADDRESS: ${ACCORDANCE_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  accordance_web_data:
  caddy_data:
  caddy_config:
